$schema: https://moonrepo.dev/schemas/workspace.json
projects:
  rs2uml: .

defaultProject: rs2uml

vcs:
  client: git
  provider: github
  defaultBranch: develop
  hooks:
    pre-commit:
    - uv run pre-commit run
    commit-msg:
    - uv run pre-commit run --hook-stage commit-msg --commit-msg-filename $ARG1
  sync: true
